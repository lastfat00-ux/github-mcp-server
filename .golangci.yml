run:
  concurrency: 4
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
linters-settings:
  staticcheck:
    checks:
      - "all"
      - -QF1008
      - -ST1000
