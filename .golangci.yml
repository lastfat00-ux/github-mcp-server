run:
  concurrency: 4
  timeout: 5m
  tests: true

linters-settings:
  staticcheck:
    checks:
      - "all"
      - -QF1008
      - -ST1000
  revive:
    rules:
      - name: exported
        disabled: true

linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused

issues:
  exclude-rules:
    - path: (third-party|builtin|examples)
      linters:
        - staticcheck
        - errcheck
        - govet
