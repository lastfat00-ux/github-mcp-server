run:
  concurrency: 4
  tests: true

linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused

issues:
  exclude-rules:
    - path: third_party$
      linters:
        - revive
    - path: builtin$
      linters:
        - revive
    - path: examples$
      linters:
        - revive
  # Exclude directories from being scanned
  exclude-dirs:
    - third-party
    - builtin
    - examples

linters-settings:
  staticcheck:
    checks:
      - "all"
      - "-QF1008"
      - "-ST1000"
  revive:
    rules:
      - name: exported
        disabled: true
