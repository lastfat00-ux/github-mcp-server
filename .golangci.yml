run:
  concurrency: 4
  tests: true

linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused

issues:
  exclude-rules:
    - path: (third_party|builtin|examples)
      linters:
        - all

linters-settings:
  staticcheck:
    checks:
      - "all"
      - "-QF1008"
      - "-ST1000"
  revive:
    rules:
      - name: package-comments
        disabled: true
