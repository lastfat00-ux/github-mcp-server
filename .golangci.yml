run:
  concurrency: 4
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
    - path: third_party/.*
      linters:
        - all

linters-settings:
  staticcheck:
    checks:
      - "all"
      - "-QF1008"
      - "-ST1000"
  revive:
    rules:
      - name: exported
        disabled: true
