run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused

issues:
  exclude-use-default: true
  exclude-rules:
    - path: (third_party|builtin|examples)
      linters:
        - staticcheck
        - govet
        - errcheck

linters-settings:
  staticcheck:
    checks:
      - "all"
      - -QF1008
      - -ST1000
