run:
  concurrency: 4
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused

linters-settings:
  staticcheck:
    checks:
      - "all"
      - "-QF1008"
      - "-ST1000"
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-dirs:
    - third_party
    - builtin
    - examples
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - bodyclose
