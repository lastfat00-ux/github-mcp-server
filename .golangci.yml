run:
  concurrency: 4
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
linters-settings:
  staticcheck:
    checks: ["all", "-QF1008", "-ST1000"]
issues:
  exclude-rules:
    - path: (third_party|builtin|examples)
      linters: [staticcheck, errcheck, gosec, revive]
    - path: _test\.go
      linters: [gosec]
    - path: pkg/github/issues\.go
      text: "QF1012:"
    - path: internal/githubv4mock/query\.go
      text: "inline: Constant reflect.Ptr"
    - path: pkg/github/secret_scanning\.go
      text: "G117:"
