run:
  concurrency: 4
  tests: true

linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused

linters-settings:
  staticcheck:
    checks:
      - "all"
      - "-QF1008"
      - "-ST1000"

issues:
  exclude-rules:
    - path: (third_party|builtin|examples)
      linters:
        - staticcheck
        - errcheck
        - govet
        - gocritic
        - gosec
        - revive
        - unused
        - ineffassign
        - misspell
        - bodyclose
        - makezero
        - nakedret
